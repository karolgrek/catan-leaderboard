<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Score tracker for Catan">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Catan Leaderboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Catan Leaderboard</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Clear legacy Flutter service worker caches so updates appear immediately
    if ('caches' in window) {
      caches.keys().then(function (names) {
        for (let name of names) {
          if (name.indexOf('flutter-app') !== -1 || name.indexOf('flutter-temp') !== -1) {
            caches.delete(name);
          }
        }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let reg of registrations) {
            if (reg.active && reg.active.scriptURL && reg.active.scriptURL.indexOf('flutter_service_worker.js') !== -1) {
              reg.unregister();
            }
          }
          navigator.serviceWorker.register('catan-sw.js').catch(function () {});
        });
      });
    }

    window.getCatanNotificationPermission = function () {
      if (!('Notification' in window)) {
        return 'unsupported';
      }
      return Notification.permission;
    };

    window.requestCatanNotificationPermission = async function () {
      if (!('Notification' in window)) {
        return 'unsupported';
      }
      try {
        const permission = await Notification.requestPermission();
        return permission;
      } catch (e) {
        return 'denied';
      }
    };

    window.showCatanNotification = async function (title, body, tag) {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return false;
      }
      const options = {
        body: body,
        icon: 'icons/Icon-192.png',
        badge: 'icons/Icon-192.png',
        tag: tag || 'catan-notif-' + Date.now(),
        vibrate: [200, 100, 200]
      };
      try {
        if ('serviceWorker' in navigator) {
          let reg = await navigator.serviceWorker.getRegistration();
          if (!reg) {
            reg = await navigator.serviceWorker.register('catan-sw.js');
          }
          if (reg && reg.showNotification) {
            await reg.showNotification(title, options);
            return true;
          }
        }
      } catch (e) {
        // Fallback to standard Notification API below
      }
      try {
        new Notification(title, options);
        return true;
      } catch (e) {
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
